[env]
# CMake bundled with Visual Studio 2022 Build Tools (builds whisper.cpp).
CMAKE = "C:/Program Files (x86)/Microsoft Visual Studio/2022/BuildTools/Common7/IDE/CommonExtensions/Microsoft/CMake/CMake/bin/cmake.exe"
# Only VS 2022 Build Tools are installed; stop cmake guessing a newer generator.
CMAKE_GENERATOR = "Visual Studio 17 2022"

[target.x86_64-pc-windows-msvc]
# Link the C runtime statically so the portable exe runs without the VC++ redistributable.
rustflags = ["-C", "target-feature=+crt-static"]
