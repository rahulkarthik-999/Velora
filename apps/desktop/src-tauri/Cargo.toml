[package]
name = "velora-desktop"
version = "0.1.0"
description = "Velora Interview Copilot"
edition = "2021"
rust-version = "1.80"

[lib]
name = "velora_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
cc = "1"
cmake = "0.1"
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
sysinfo = { version = "0.40", default-features = false, features = ["system", "disk"] }
dirs = "7"
sha2 = "0.10"
hex = "0.4"
crossbeam-channel = "0.5"
cpal = "0.17"
rusqlite = { version = "0.41", features = ["bundled"] }
ureq = "3"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
pdf-extract = "0.12"
quick-xml = "0.42"
keyring = { version = "3", features = ["windows-native"] }
zip = { version = "4", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
